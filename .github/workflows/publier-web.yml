# Compile la version Blazor (dossier web/) et la publie sur GitHub Pages
# à chaque push sur main. Dans le dépôt GitHub : Settings > Pages >
# Source = « GitHub Actions ».
name: Publier la version web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  compiler:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Compiler
        run: dotnet publish web/StationMeteoWeb.csproj -c Release -o publication

      - name: Adapter au sous-dossier GitHub Pages
        run: |
          cd publication/wwwroot
          # Le site est servi sous /<nom-du-depot>/ et non à la racine.
          sed -i 's|<base href="/" />|<base href="/${{ github.event.repository.name }}/" />|' index.html
          rm -f index.html.br index.html.gz
          cp index.html 404.html
          # Sans ce fichier, GitHub ignore le dossier _framework.
          touch .nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: publication/wwwroot

  deployer:
    needs: compiler
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4
